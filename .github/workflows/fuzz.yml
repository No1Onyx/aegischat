name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *'   # nightly
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ratchet_decrypt
          - wire_message_parse
          - db_open
          - mnemonic_parse
          - sealed_envelope_parse
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-crypto/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (5 min)
        working-directory: core-crypto
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: core-crypto/fuzz/artifacts/
