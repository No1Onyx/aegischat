[package]
name = "aegis-core-crypto"
version = "0.1.0"
edition = "2021"
description = "Hardened, Memory-Safe Cryptographic Engine for AegisChat (Double Ratchet, X3DH, Zero-Anchor BIP-39, Sealed Sender)"
authors = ["Aegis Security Core"]

[lib]
name = "aegis_core_crypto"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Elliptic Curve Cryptography (Audited Dalek Cryptography)
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }

# Authenticated Encryption (AEAD)
chacha20poly1305 = "0.10"

# Key Derivation & Hashing
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"

# Anti-Forensic RAM Scrubbing (Scrubs keys from RAM on drop)
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }

# Cryptographically Secure Random Number Generation
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }

# Zero-Anchor Account Creation (No phone, no email: 12/24 words)
bip39 = "2.1"

# Serialization for wire and storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
