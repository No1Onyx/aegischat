[package]
name = "aegis-core-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"

[dependencies.aegis-core-crypto]
path = ".."

# Prevent this from interfering with `cargo build` at the workspace root.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "ratchet_decrypt"
path = "fuzz_targets/ratchet_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_message_parse"
path = "fuzz_targets/wire_message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "db_open"
path = "fuzz_targets/db_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mnemonic_parse"
path = "fuzz_targets/mnemonic_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_envelope_parse"
path = "fuzz_targets/sealed_envelope_parse.rs"
test = false
doc = false
bench = false
