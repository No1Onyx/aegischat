# Minimal relay deployment: the blind relay behind Caddy for automatic TLS.
#
#   1. Point a DNS A/AAAA record at this host (e.g. relay.example.org).
#   2. Edit deploy/Caddyfile with that hostname + your email.
#   3. Set AEGIS_ALLOWED_ORIGINS to the origin(s) your client is served from.
#   4. docker compose -f deploy/docker-compose.yml up -d --build
#
# Build the client separately with VITE_RELAY_URL=https://relay.example.org
# and host the static bundle wherever you like (it needs no server of its own).

services:
  relay:
    build:
      context: ../server
    environment:
      - PORT=4000
      - AEGIS_ALLOWED_ORIGINS=${AEGIS_ALLOWED_ORIGINS:-https://app.example.org}
    restart: unless-stopped
    # Not published to the host — only Caddy reaches it.
    expose:
      - "4000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
